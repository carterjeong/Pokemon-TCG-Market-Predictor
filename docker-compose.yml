# ============================================================
# Local dev stack: FastAPI + PostgreSQL 16
# Shared file — app service (Carter), hardening flags (CyberSec)
# Usage:  cp .env.example .env   &&   docker compose up --build
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptcg-api
    env_file: .env
    environment:
      POSTGRES_HOST: db          # override localhost inside the network
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # --- Hardening (Owner: CyberSec) ---
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    container_name: ptcg-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ptcg_market}
    ports:
      - "127.0.0.1:5432:5432"   # host access for psql/IDE only; not exposed on LAN
    volumes:
      - ptcg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptcg} -d ${POSTGRES_DB:-ptcg_market}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  ptcg_pgdata:
